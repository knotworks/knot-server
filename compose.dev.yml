services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor

  queue:
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor

  scheduler:
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -lc "corepack enable && pnpm install && pnpm run dev --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - '${VITE_PORT:-5173}:5173'
    volumes:
      - ./:/var/www/html
      - node-modules-data:/var/www/html/node_modules

  mailpit:
    image: axllent/mailpit:v1.25
    restart: unless-stopped
    ports:
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
      - '${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  vendor-data:
  node-modules-data:
